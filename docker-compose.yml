services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: centurion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: centurion
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centurion"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
