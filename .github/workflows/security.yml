name: Security analysis
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076a # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076a # v4
        with:
          output: sarif-results
      - name: Summarize and enforce security findings
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          let findings = 0;
          for (const file of readdirSync('sarif-results').filter(f => f.endsWith('.sarif'))) {
            const report = JSON.parse(readFileSync('sarif-results/' + file, 'utf8'));
            for (const run of report.runs ?? []) {
              const rules = new Map((run.tool.driver.rules ?? []).map(r => [r.id, r]));
              for (const result of run.results ?? []) {
                const severity = Number(rules.get(result.ruleId)?.properties?.['security-severity'] ?? 0);
                if (severity >= 4) { findings++; console.log('Security finding: ' + result.ruleId); }
              }
            }
          }
          if (findings) process.exit(1);
          console.log('No medium-or-higher CodeQL security findings.');
          NODE

  secrets:
    name: Scan tracked files for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified secret scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan repository snapshot without disclosing secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/security-source"
          /tmp/gitleaks dir --redact --no-banner "$RUNNER_TEMP/security-source"
