name: Validate and deploy Centurion
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: centurion
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: centurion
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://centurion:ci-only-password@localhost:5432/centurion
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-not-for-production-01234567890123456789
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run db:migrate:deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify production server and complete user journey
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/centurion.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::Centurion did not become healthy."
            cat /tmp/centurion.log
            exit 1
          fi
          npm run test:e2e

  deploy:
    name: Deploy production
    needs: [verify, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: centurion-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://centurion-blush.vercel.app
    env:
      VERCEL_ORG_ID: team_SYJGIcK1XVMuNA4t0ZMzUt8h
      VERCEL_PROJECT_ID: prj_thG8OPVzhMFgw7B6SP7bWcUwX3Br
      VERCEL_CLI_VERSION: 66.6.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Check deployment authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add VERCEL_TOKEN to the production environment secrets in GitHub Settings > Environments."
            exit 1
          fi
      - name: Reject superseded release
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo "::error::A newer main commit exists; deploy that commit instead."; exit 1; }
      - name: Install pinned deployment CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull production configuration
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build production artifact
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Migrations are deliberately separate: never expose the database-owner
      # connection to the build or runtime. Apply additive migrations before release.
      - name: Stage tested production build
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --skip-domain)"
          DEPLOYMENT_URL="$url" node --input-type=module -e '
            const value = process.env.DEPLOYMENT_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value || !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
      - name: Check staged application and database
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          vercel curl "$DEPLOYMENT_URL/api/health" -- --fail --silent --show-error --max-time 60 > /tmp/health.json
          node -e 'const h=require("/tmp/health.json"); if(h.status!=="ok") process.exit(1)'
          vercel curl "$DEPLOYMENT_URL/login" -- --fail --silent --show-error --max-time 60 > /tmp/login.html
          grep -q 'Sign in' /tmp/login.html
      - name: Promote verified build
        run: vercel promote "$DEPLOYMENT_URL" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
      - name: Verify public production URL
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 60 https://centurion-blush.vercel.app/api/health > /tmp/public-health.json
          node -e 'const h=require("/tmp/public-health.json"); if(h.status!=="ok") process.exit(1)'
          echo "Centurion: https://centurion-blush.vercel.app" >> "$GITHUB_STEP_SUMMARY"
