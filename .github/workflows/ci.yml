name: Validate Centurion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: centurion
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: centurion
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://centurion:ci-only-password@localhost:5432/centurion
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-not-for-production-01234567890123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx tsx scripts/migrate.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start > /tmp/centurion.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            playwright-report/
            test-results/
